[package]
name = "baton-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
desktop = ["dep:tauri", "dep:tauri-build"]
acceptance = ["tokio/net", "tokio/io-util"]

[[bin]]
name = "baton-ui-acceptance"
path = "src/acceptance_main.rs"
required-features = ["desktop", "acceptance"]

[[bin]]
name = "baton"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
baton-core = { path = "../../crates/baton-core" }
baton-ssh = { path = "../../crates/baton-ssh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
getrandom = "=0.3.4"
zeroize = "=1.9.0"
tauri = { version = "=2.11.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }
