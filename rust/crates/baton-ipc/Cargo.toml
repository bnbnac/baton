[package]
name = "baton-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
baton-core = { path = "../baton-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }
